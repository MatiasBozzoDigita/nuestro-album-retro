<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestro Álbum Retro</title>
<meta name="theme-color" content="#17142b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: consola de bolsillo — cabecera fija, contenido en panel central, barra de navegación tipo botonera abajo. */
:root{
  --bg:#17142b; --panel:#231e41; --panel2:#2e2853; --line:#4a4382; --ink:#f3ecd9; --mute:#a39dd0;
  --red:#e0483e; --yel:#f4c430; --grn:#3fae6a; --blu:#4377e0;
  --c-C:#8a84b8; --c-R:#4f8bff; --c-B:#d38cff; --c-L:#f4c430;
  --pix:"Press Start 2P", ui-monospace, monospace;
  --body:"VT323", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:20px;line-height:1.15;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(circle at 20% 0%,#2a2350 0,transparent 55%),radial-gradient(circle at 100% 100%,#24183f 0,transparent 50%);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3,.pix{font-family:var(--pix);font-weight:400;letter-spacing:.02em}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  border-bottom:3px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;max-width:960px;margin:0 auto}
.logo{display:flex;gap:3px}
.logo i{width:10px;height:10px;display:block}
.hd h1{font-size:11px;line-height:1.5;flex:1;min-width:0}
.hd h1 small{display:block;font-family:var(--body);font-size:18px;color:var(--mute);letter-spacing:0}
.chip{font-family:var(--pix);font-size:9px;padding:7px 8px;background:var(--panel2);box-shadow:0 0 0 2px var(--line);white-space:nowrap}
.chip b{color:var(--yel);font-weight:400}
.iconbtn{background:var(--panel2);border:0;box-shadow:0 0 0 2px var(--line);padding:6px 8px;font-family:var(--pix);font-size:9px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#100d20;border-top:3px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav .row{display:flex;gap:8px;max-width:640px;margin:0 auto}
nav button{flex:1;border:0;background:var(--panel);box-shadow:0 0 0 2px var(--line),0 4px 0 2px #000;padding:10px 2px 8px;font-family:var(--pix);font-size:8px;line-height:1.6;position:relative}
nav button[aria-current="true"]{background:var(--red);box-shadow:0 0 0 2px #ff8a7f,0 4px 0 2px #6b1510}
nav button .dot{position:absolute;top:-6px;right:-4px;background:var(--yel);color:#000;font-size:8px;padding:3px 4px}
nav button:active{transform:translateY(3px)}

main{padding-top:18px}
.sec{display:flex;flex-direction:column;gap:16px}
.box{background:var(--panel);box-shadow:0 0 0 3px var(--line),5px 5px 0 3px #0008;padding:16px}
.lbl{font-family:var(--pix);font-size:9px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--mute)}
.btn{border:0;background:var(--yel);color:#1a1300;font-family:var(--pix);font-size:10px;padding:13px 14px;box-shadow:0 0 0 3px #fff2,0 5px 0 3px #6e5300;line-height:1.5}
.btn.red{background:var(--red);color:#fff;box-shadow:0 0 0 3px #fff2,0 5px 0 3px #6b1510}
.btn.blue{background:var(--blu);color:#fff;box-shadow:0 0 0 3px #fff2,0 5px 0 3px #1b3577}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 0 0 3px var(--line),0 5px 0 3px #000}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 3px #fff2,0 1px 0 3px #0008}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{font-size:8px;padding:9px 10px}
input[type=text],input[type=number],select{font-family:var(--body);font-size:22px;background:#0f0c1f;color:var(--ink);border:0;box-shadow:0 0 0 2px var(--line);padding:6px 10px;width:100%;min-width:0}

/* album */
.pagehd{display:flex;align-items:center;gap:10px}
.pagehd .ttl{flex:1;min-width:0;text-align:center}
.pagehd h2{font-size:12px;line-height:1.6;text-wrap:balance}
.pagehd .who{font-size:18px;color:var(--mute)}
.arrow{border:0;background:var(--panel2);box-shadow:0 0 0 3px var(--line),0 4px 0 3px #000;width:46px;height:46px;font-family:var(--pix);font-size:14px;flex:none}
.arrow:active{transform:translateY(3px)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots button{width:22px;height:22px;border:0;padding:0;background:var(--panel2);box-shadow:0 0 0 2px var(--line);font-family:var(--pix);font-size:7px;color:var(--mute)}
.dots button.full{background:var(--grn);color:#062}
.dots button[aria-current="true"]{box-shadow:0 0 0 2px var(--yel);color:var(--ink)}
.prog{height:14px;background:#0f0c1f;box-shadow:0 0 0 2px var(--line);position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--pc,var(--grn)) 0 8px,color-mix(in srgb,var(--pc,var(--grn)) 75%,#000) 8px 10px)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 16px;padding:6px 4px}
@media (min-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}

.slot{aspect-ratio:5/7;max-width:100%;border:0;padding:0;background:repeating-linear-gradient(45deg,#1a1633 0 6px,#1f1a3c 6px 12px);
  box-shadow:0 0 0 3px #3a3468;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#6d669e;container-type:inline-size;text-align:center}
.slot .n{font-family:var(--pix);font-size:13cqw}
.slot .t{font-size:13cqw;padding:0 6px;line-height:.95}
.slot .have{font-family:var(--pix);font-size:6cqw;color:var(--yel);padding:0 4px;line-height:1.5}
.slotbtn{border:0;padding:0;background:none;display:block;width:100%;position:relative}

/* card */
.card{aspect-ratio:5/7;width:100%;max-width:100%;position:relative;background:var(--panel2);container-type:inline-size;
  box-shadow:0 0 0 3px var(--rc),4px 4px 0 3px #0009;display:flex;flex-direction:column;overflow:hidden}
.card .top{background:var(--pc);color:#fff;font-family:var(--pix);font-size:6.5cqw;padding:5cqw 5cqw 4cqw;display:flex;justify-content:space-between;align-items:center;text-shadow:1px 1px 0 #0006}
.card .art{flex:1;margin:0 5cqw;background:#0c0a1a center/cover no-repeat;image-rendering:pixelated;box-shadow:inset 0 0 0 2px #0006;position:relative;overflow:hidden}
.card .art.spr{background-size:76% auto;background-color:color-mix(in srgb,var(--pc) 22%,#0c0a1a)}
.card .nm{font-size:12.5cqw;line-height:.9;padding:4cqw 5cqw 2cqw;text-align:center;min-height:2.3em;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.card .rar{display:flex;justify-content:center;gap:2cqw;padding-bottom:5cqw}
.card .rar i{width:5cqw;height:5cqw;background:var(--rc);display:block}
.card .cnt{position:absolute;top:-10px;right:-10px;z-index:3;background:var(--yel);color:#000;font-family:var(--pix);font-size:9px;padding:5px 6px;box-shadow:0 0 0 2px #000}
.card.holo .shine{position:absolute;top:0;bottom:0;left:-100%;width:100%;pointer-events:none;opacity:.5;will-change:transform;
  background:linear-gradient(105deg,transparent 15%,#ff8fe066 38%,#8feaff77 50%,#fff59a66 62%,transparent 85%);animation:holo 3.2s ease-in-out infinite}
.card.lg::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px #fff6b0,inset 0 0 14px 2px #f4c43088;opacity:0;animation:lgpulse 1.6s ease-in-out infinite;will-change:opacity}
@keyframes holo{0%{transform:translateX(0)}60%,100%{transform:translateX(200%)}}
@keyframes lgpulse{50%{opacity:1}}
.ov-open main .card .shine,.ov-open main .card.lg::after{animation-play-state:paused}

/* sobres */
.stock{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.minipack{width:74px;aspect-ratio:3/4;flex:none;position:relative;box-shadow:0 0 0 3px #fff3,5px 5px 0 3px #0009;
  background:linear-gradient(135deg,var(--red) 0 25%,var(--yel) 25% 50%,var(--grn) 50% 75%,var(--blu) 75%);}
.minipack::after{content:"MB";position:absolute;inset:30% 14%;background:#17142b;color:var(--yel);font-family:var(--pix);font-size:11px;display:flex;align-items:center;justify-content:center}
.big{font-family:var(--pix);font-size:28px;color:var(--yel)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1;min-width:0}
.odds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.odds div{background:#0f0c1f;box-shadow:0 0 0 2px var(--line);padding:8px;text-align:center}
.odds b{display:block;font-family:var(--pix);font-size:11px;font-weight:400;margin-top:4px}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:#080610e6;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.ovin{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px;margin:auto}
.ov.shake .ovin{animation:shake .5s steps(6) 2}
.ov.flash::before{content:"";position:fixed;inset:0;background:#fff6b0;animation:flash .6s ease-out forwards;pointer-events:none}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,5px)}}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.pack{width:min(240px,62vw);aspect-ratio:3/4.3;position:relative;touch-action:none;user-select:none;cursor:grab;
  background:linear-gradient(135deg,var(--red) 0 25%,var(--yel) 25% 50%,var(--grn) 50% 75%,var(--blu) 75%);box-shadow:0 0 0 4px #fff4,8px 8px 0 4px #000a}
.pack .body{position:absolute;inset:18% 12% 10%;background:#17142b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:10px}
.pack .body .pix{font-size:10px;line-height:1.7;color:var(--yel)}
.pack .strip{position:absolute;left:0;right:0;top:6%;height:6%;background:repeating-linear-gradient(90deg,#fff8 0 6px,transparent 6px 12px)}
.pack .strip i{position:absolute;inset:0 auto 0 0;background:#17142b;width:0}
.pack.gone{animation:gone .4s ease-in forwards}
@keyframes gone{to{transform:translateY(-40px) scale(1.15);opacity:0}}
.hint{font-family:var(--pix);font-size:9px;color:var(--mute);text-align:center;line-height:1.7;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.reveal{display:grid;grid-template-columns:repeat(2,minmax(0,170px));gap:22px 20px;justify-content:center;width:100%}
@media (min-width:640px){.reveal{grid-template-columns:repeat(4,minmax(0,130px))}}
.fc{perspective:900px;border:0;padding:0;background:none;display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;animation:deal .35s cubic-bezier(.2,.8,.3,1) backwards}
.fcin{width:100%;aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1);will-change:transform}
.fc.on .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.back{width:100%;height:100%;box-shadow:0 0 0 3px #fff3,4px 4px 0 3px #0009;
  background:repeating-conic-gradient(#2e2853 0 25%,#231e41 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:28px;color:var(--yel)}
.tag{font-family:var(--pix);font-size:8px;padding:5px 6px;visibility:hidden}
.fc.on .tag{visibility:visible}
.tag.new{background:var(--grn);color:#021}
.tag.dup{background:#3a3468;color:var(--mute)}
@keyframes deal{from{transform:translateY(40px) scale(.9);opacity:0}}
.ovtitle{font-size:12px;text-align:center;line-height:1.7}
.zoom{width:min(280px,70vw)}

/* cambios */
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 12px;padding:6px 4px}
.pick{border:0;padding:0;background:none;position:relative}
.pick[aria-pressed="true"] .card{outline:4px solid var(--yel);outline-offset:4px}
.trade{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.trade .mc{width:70px;flex:none}
.trade .ar{font-family:var(--pix);font-size:14px;color:var(--yel)}
.trade .txt{flex:1;min-width:140px}
.split{display:grid;gap:16px}
@media (min-width:720px){.split{grid-template-columns:1fr 1fr}}
.empty{color:var(--mute);padding:6px 0}

/* marcador */
.score{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.score .box{text-align:center}
.score .pct{font-family:var(--pix);font-size:24px;margin:10px 0 8px;color:var(--yel)}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center}
.pr .nm{grid-column:1/-1;font-size:20px;margin-top:8px}
.pr .v{font-family:var(--pix);font-size:9px;text-align:right}

/* taller */
.edl{display:grid;gap:10px}
.edrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
.edrow .mc{width:52px}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--yel);color:#1a1300;font-family:var(--pix);font-size:10px;line-height:1.6;padding:12px 14px;box-shadow:0 0 0 3px #000,6px 6px 0 3px #0008;max-width:calc(100% - 32px);text-align:center}
.banner{background:#3a2a10;box-shadow:0 0 0 2px var(--yel);padding:8px 12px;color:#ffe6a6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* login */
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(circle at 50% 0%,#2a2350 0,transparent 60%)}
.login .in{width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center}
.login .logo{justify-content:center}
.login .logo i{width:16px;height:16px}
.login h1{font-size:15px;line-height:1.7;margin:6px 0 0;color:var(--yel)}
.login .press{font-family:var(--pix);font-size:9px;color:var(--mute);animation:blink 1s steps(2) infinite}
.login label{text-align:left;display:flex;flex-direction:column;gap:6px}
.login .err{color:#ff8a7f;min-height:1.2em}
.boot{font-family:var(--pix);font-size:10px;color:var(--mute)}
</style>
</head>
<body>
<section class="login" id="login" hidden>
  <form class="in" id="loginform" autocomplete="on">
    <div class="logo" aria-hidden="true"><i style="background:var(--red)"></i><i style="background:var(--yel)"></i><i style="background:var(--grn)"></i><i style="background:var(--blu)"></i></div>
    <h1 class="pix">NUESTRO<br>ÁLBUM RETRO</h1>
    <div class="press">PRESS START</div>
    <label><span class="lbl">Jugador</span><input type="text" id="lu" name="username" autocomplete="username" autocapitalize="words" placeholder="Mati o Marcelita"></label>
    <label><span class="lbl">Contraseña</span><input type="password" id="lp" name="password" autocomplete="current-password" style="font-family:var(--body);font-size:22px;background:#0f0c1f;color:var(--ink);border:0;box-shadow:0 0 0 2px var(--line);padding:6px 10px;width:100%"></label>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn red" id="lbtn" type="submit">ENTRAR</button>
  </form>
</section>
<div id="app" hidden>
<header><div class="hd">
  <div class="logo" aria-hidden="true"><i style="background:var(--red)"></i><i style="background:var(--yel)"></i><i style="background:var(--grn)"></i><i style="background:var(--blu)"></i></div>
  <h1>NUESTRO ÁLBUM RETRO<small id="hdsub">Cargando…</small></h1>
  <span class="chip" id="hdpacks">SOBRES <b>0</b></span>
  <button class="iconbtn" id="mute" aria-label="Sonido">♪ ON</button>
</div></header>

<div class="wrap"><main id="main"></main></div>

<nav><div class="row" id="nav"></div></nav>
</div>
<div class="ov" id="ov" hidden><div class="ovin" id="ovin"></div></div>
<div class="toast" id="toast" hidden></div>


<script type="module">

/* ===== Jugadores ===== */
const DOMAIN='nuestroalbum.app';

const OWNER='matias';

/* ===== Datos del álbum ===== */
const RAR={C:{n:'Común',p:70},R:{n:'Rara',p:22},B:{n:'Brillante',p:6},L:{n:'Legendaria',p:2}};

/* ===== Sonido 8-bit ===== */
let AC=null,muted=false;
try{muted=localStorage.getItem('alb_mute')==='1'}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,when=0,type='square',v=.05){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  const t=a.currentTime+when;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}
const sfx={
  blip:()=>tone(880,.06),
  flip:()=>{tone(523,.05);tone(784,.06,.05)},
  tear:()=>{for(let i=0;i<6;i++)tone(200+Math.random()*400,.03,i*.025,'sawtooth',.03)},
  rare:()=>[659,784,988].forEach((f,i)=>tone(f,.09,i*.07)),
  fan:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.14,i*.11,'square',.06)),
  ok:()=>[784,1175].forEach((f,i)=>tone(f,.08,i*.08)),
  no:()=>[300,200].forEach((f,i)=>tone(f,.1,i*.1))
};

/* ===== Sprites pixel de relleno ===== */
const sprCache={};
function rng(seed){let a=0;for(const ch of seed)a=(a*31+ch.charCodeAt(0))|0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function sprite(c){
  if(sprCache[c.id])return sprCache[c.id];
  const r=rng(c.id+'x'),N=12,cv=document.createElement('canvas');cv.width=cv.height=N;const g=cv.getContext('2d');
  const cols=[PAGES[c.page].c,'#f3ecd9',c.r==='L'?'#f4c430':c.r==='B'?'#d38cff':'#17142b'];
  for(let y=1;y<N-1;y++)for(let x=1;x<N/2;x++){const v=r();if(v<.45)continue;g.fillStyle=cols[v<.75?0:v<.9?1:2];g.fillRect(x,y,1,1);g.fillRect(N-1-x,y,1,1);}
  return sprCache[c.id]=cv.toDataURL();
}

function draw(){const r=Math.random()*100,k=r<2?'L':r<8?'B':r<30?'R':'C',l=BYR[k];return l[Math.floor(Math.random()*l.length)];}
function openPack(){
  const pl=P(me);if((pl.packs||0)<1||openedToday(me)>=cap())return;
  const owned={...(pl.owned||{})},upd={},drawn=[],before=PAGES.map((_,i)=>pageDone(me,i));
  for(let i=0;i<4;i++){const c=draw(),was=owned[c.id]||0;drawn.push({c,isNew:was===0});owned[c.id]=was+1;upd[c.id]=owned[c.id];}
  const done=PAGES.map((_,i)=>i).filter(i=>before[i]<10&&CARDS.filter(c=>c.page===i&&owned[c.id]).length===10);
  patchPlayer(me,{owned:upd,packs:(pl.packs||1)-1,openedDay:today(),openedToday:openedToday(me)+1,opened:(pl.opened||0)+1});
  showPack(drawn,done);
}
function showPack(drawn,done){
  const ov=$('ov'),inn=$('ovin');ov.hidden=false;ov.className='ov';document.body.classList.add('ov-open');
  inn.innerHTML=`<div class="pack" id="pk"><div class="strip"><i id="pkst"></i></div><div class="body"><div class="pix">NUESTRO<br>ÁLBUM<br>RETRO</div><div class="muted">4 láminas</div></div></div>
    <div class="hint">DESLIZA O TOCA<br>PARA ABRIR</div>`;
  const pk=$('pk'),st=$('pkst');let prog=0,sx=null,gone=false;
  const setP=v=>{prog=Math.min(1,v);st.style.width=prog*100+'%';if(prog>=1)torn();};
  pk.onpointerdown=e=>{sx=e.clientX;pk.setPointerCapture(e.pointerId);ac();};
  pk.onpointermove=e=>{if(sx==null)return;const d=Math.abs(e.clientX-sx);if(d>8){sfx.tear();setP(prog+d/pk.offsetWidth);sx=e.clientX;}};
  pk.onpointerup=e=>{if(sx!=null&&Math.abs(e.clientX-sx)<6&&prog<1){sfx.tear();setP(prog+.34);}sx=null;};
  function torn(){if(gone)return;gone=true;pk.onpointermove=pk.onpointerdown=pk.onpointerup=null;pk.classList.add('gone');if(navigator.vibrate)navigator.vibrate(30);setTimeout(reveal,420);}
  function reveal(){
    inn.innerHTML=`<div class="ovtitle pix">TOCA CADA LÁMINA</div><div class="reveal">${drawn.map((d,i)=>`<button class="fc" data-i="${i}" style="animation-delay:${i*.08}s"><div class="fcin"><div class="face"><div class="back">?</div></div><div class="face front">${cardHTML(d.c)}</div></div><span class="tag ${d.isNew?'new':'dup'}">${d.isNew?'¡NUEVA!':'REPETIDA'}</span></button>`).join('')}</div>
      <div class="row" id="pkdone" hidden></div>`;
    let left=drawn.length;
    inn.querySelectorAll('.fc').forEach(b=>b.onclick=()=>{if(b.classList.contains('on'))return;b.classList.add('on');const d=drawn[+b.dataset.i];
      if(d.c.r==='L'){ov.classList.add('shake','flash');sfx.fan();if(navigator.vibrate)navigator.vibrate([80,60,80,60,200]);setTimeout(()=>ov.classList.remove('shake','flash'),1100);}
      else if(d.c.r==='B'||d.c.r==='R')sfx.rare();else sfx.flip();
      if(--left===0){const r=$('pkdone');r.hidden=false;const more=(P(me).packs||0)>0&&openedToday(me)<cap();
        r.innerHTML=`<button class="btn" id="pkok">AL ÁLBUM</button>${more?'<button class="btn red" id="pkmore">ABRIR OTRO</button>':''}`;
        $('pkok').onclick=()=>{closeOv();tab='album';page=drawn[0].c.page;render();celebrate(done);};
        const m=$('pkmore');if(m)m.onclick=()=>{celebrate(done);openPack();};}
    });
  }
}
function celebrate(done){if(done&&done.length){setTimeout(()=>{sfx.fan();toast('¡PÁGINA COMPLETA! '+done.map(i=>PAGES[i].t).join(' · '));},250);}}
function closeOv(){const ov=$('ov');ov.hidden=true;ov.className='ov';$('ovin').innerHTML='';document.body.classList.remove('ov-open');if(dirty){dirty=false;render();}}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov'&&!$('pk')&&!document.querySelector('.fc'))closeOv();});

function showCard(id){
  const c=CBY[id],n=cnt(me,id),o=other(),on=cnt(o,id);
  $('ov').hidden=false;document.body.classList.add('ov-open');
  $('ovin').innerHTML=`${n?`<div class="zoom">${cardHTML(c,n)}</div>`:`<div class="zoom"><div class="slot" style="width:100%"><span class="n">${String(c.num).padStart(3,'0')}</span><span class="t">${esc(cname(c))}</span></div></div>`}
    <div class="box" style="width:100%;text-align:center"><div class="lbl">${esc(PAGES[c.page].t)} · ${RAR[c.r].n}</div>
    <div style="font-size:24px;margin-top:8px">${n?`Tienes ${n}${n>1?` (${n-1} repetida${n>2?'s':''})`:''}`:'Te falta esta lámina'}</div>
    <div class="muted">${esc(nm(o))} tiene ${on}</div></div>
    <div class="row">${!n&&on>1?`<button class="btn" id="ask">PEDÍRSELA</button>`:''}<button class="btn ghost" id="cls">CERRAR</button></div>`;
  $('cls').onclick=closeOv;
  const a=$('ask');if(a)a.onclick=()=>{tWant=id;tGive=null;closeOv();tab='cambios';render();toast('Ahora elige qué repetida le das');};
}

async function claimDaily(){if(P(me).lastDaily===today())return;sfx.ok();await patchPlayer(me,{packs:(P(me).packs||0)+1,lastDaily:today()});toast('+1 sobre diario');}
async function swapDups(){
  if(dups(me)<5)return;const upd={};let need=5;
  for(const k of ['C','R','B','L'])for(const c of BYR[k]){while(need>0&&(upd[c.id]??cnt(me,c.id))>1){upd[c.id]=(upd[c.id]??cnt(me,c.id))-1;need--;}}
  sfx.ok();await patchPlayer(me,{owned:upd,packs:(P(me).packs||0)+1});toast('Canjeaste 5 repetidas por 1 sobre');
}
async function redeem(){
  const inp=$('code'),code=(inp.value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!code)return;
  try{const s=await getDoc(doc(fs,'codes',code));const d=s.exists()&&s.data();
    if(!d){sfx.no();toast('Ese código no existe');return;}
    if(d.used){sfx.no();toast('Ese código ya fue usado');return;}
    await updateDoc(doc(fs,'codes',code),{used:true,by:me,usedAt:Date.now()});
    await patchPlayer(me,{packs:(P(me).packs||0)+(d.packs||1)});sfx.fan();toast(`¡Código secreto! +${d.packs||1} sobre${(d.packs||1)>1?'s':''}`);inp.value='';
  }catch(e){toast('No se pudo canjear. Intenta de nuevo.');}
}
async function propose(){
  if(!tGive||!tWant)return;const t={from:me,to:other(),give:tGive,want:tWant,status:'pending',at:Date.now()};
  tGive=tWant=null;sfx.ok();
  try{await addDoc(collection(fs,'trades'),t);toast('Propuesta enviada');}catch(e){toast('No se pudo enviar la propuesta');}
}
const setTrade=(id,obj)=>q('t'+id,()=>updateDoc(doc(fs,'trades',id),obj).catch(()=>toast('No se pudo actualizar')));
async function accept(id){
  try{
    const c=await getDoc(doc(fs,'trades',id));
    if(!c.exists()||c.data().status!=='pending'){toast('Esta propuesta ya no está vigente');return;}
    const t=c.data();
    const [a,b]=await Promise.all([getDoc(doc(fs,'players',t.from)),getDoc(doc(fs,'players',t.to))]);
    const fr=a.exists()?a.data():def(),to=b.exists()?b.data():def();
    const fg=(fr.owned||{})[t.give]||0,fw=(fr.owned||{})[t.want]||0,tw=(to.owned||{})[t.want]||0,tg=(to.owned||{})[t.give]||0;
    if(fg<2||tw<2){sfx.no();await setTrade(id,{status:'rejected'});toast('Una de las láminas ya no está repetida. Se anuló el cambio.');return;}
    await patchPlayer(t.from,{owned:{[t.give]:fg-1,[t.want]:fw+1},trades:(fr.trades||0)+1});
    await patchPlayer(t.to,{owned:{[t.want]:tw-1,[t.give]:tg+1},trades:(to.trades||0)+1});
    await setTrade(id,{status:'accepted',doneAt:Date.now()});sfx.fan();toast('¡Cambio hecho!');
  }catch(e){toast('Sin conexión, intenta de nuevo');}
}
async function mkCode(){
  const n=Math.max(1,Math.min(10,+$('cpacks').value||1));
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<6;i++)c+=A[Math.floor(Math.random()*A.length)];
  try{await setDoc(doc(fs,'codes',c),{packs:n,used:false,at:Date.now()});sfx.ok();toast('Código creado: '+c);}catch(e){toast('No se pudo crear el código');}
}
async function doReset(){
  if(!resetArm){resetArm=true;render();setTimeout(()=>{if(resetArm){resetArm=false;if(tab==='taller')render();}},5000);return;}
  resetArm=false;
  try{await Promise.all(WHO.map(w=>q('p'+w,()=>setDoc(doc(fs,'players',w),def()))));
    for(const t of S.trades)await deleteDoc(doc(fs,'trades',t.id));toast('Progreso reiniciado');}catch(e){toast('No se pudo reiniciar');}
}
/* Fotos: se comprimen en el celular (máx. 400 px de ancho) y se guardan en la base de datos */
function compress(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
  const W=400,H=560,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;g.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  URL.revokeObjectURL(img.src);res(cv.toDataURL('image/jpeg',.78));};img.onerror=rej;img.src=URL.createObjectURL(file);});}
async function upload(id,file){
  if(!file)return;toast('Subiendo foto…');
  try{const d=await compress(file);await setDoc(doc(fs,'cardimg',id),{d});toast('Foto lista');}catch(e){toast('No se pudo subir esa foto');}
}

/* ===== Eventos ===== */
const nameT={};
function debounced(key,fn){clearTimeout(nameT[key]);nameT[key]=setTimeout(fn,600);}
function bind(){
  const m=$('main');
  m.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{page=(page+ +b.dataset.pg+10)%10;sfx.blip();render();});
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=+b.dataset.go;sfx.blip();render();});
  m.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{sfx.blip();showCard(b.dataset.card);});
  const g=$('grid');if(g){let x0=null;g.ontouchstart=e=>x0=e.touches[0].clientX;g.ontouchend=e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60){page=(page+(d<0?1:-1)+10)%10;sfx.blip();render();}x0=null;};}
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn;};
  on('open',()=>{ac();sfx.blip();openPack();});on('daily',claimDaily);on('swap',swapDups);on('redeem',redeem);on('propose',propose);on('mkcode',mkCode);on('reset',doReset);
  on('logout',()=>{signOut(auth);});
  m.querySelectorAll('[data-give]').forEach(b=>b.onclick=()=>{tGive=tGive===b.dataset.give?null:b.dataset.give;sfx.blip();render();});
  m.querySelectorAll('[data-want]').forEach(b=>b.onclick=()=>{tWant=tWant===b.dataset.want?null:b.dataset.want;sfx.blip();render();});
  m.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{b.disabled=true;accept(b.dataset.acc);});
  m.querySelectorAll('[data-rej]').forEach(b=>b.onclick=()=>{sfx.no();setTrade(b.dataset.rej,{status:'rejected'});});
  m.querySelectorAll('[data-can]').forEach(b=>b.onclick=()=>{setTrade(b.dataset.can,{status:'cancelled'});});
  m.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{me=b.dataset.as;tGive=tWant=null;sfx.ok();render();});
  WHO.forEach(w=>{const i=$('nm-'+w);if(i)i.oninput=()=>debounced('nm'+w,()=>patchCfg({names:{[w]:i.value.trim()||(w==='matias'?'Mati':'Marcelita')}}));});
  const ci=$('capin');if(ci)ci.oninput=()=>debounced('cap',()=>patchCfg({cap:Math.max(1,Math.min(20,+ci.value||3))}));
  const tp=$('tpage');if(tp)tp.onchange=()=>{tallerPage=+tp.value;render();};
  m.querySelectorAll('[data-cn]').forEach(i=>i.oninput=()=>debounced('cn'+i.dataset.cn,()=>patchCfg({cards:{[i.dataset.cn]:{name:i.value.trim()}}})));
  m.querySelectorAll('[data-up]').forEach(i=>i.onchange=()=>upload(i.dataset.up,i.files[0]));
}

/* ===== Inicio de sesión ===== */
$('loginform').addEventListener('submit',async e=>{
  e.preventDefault();ac();
  const u=slug($('lu').value),pw=$('lp').value,err=$('lerr'),btn=$('lbtn');
  err.textContent='';
  if(!USERS[u]){err.textContent='Ese jugador no existe. Escribe Mati o Marcelita.';sfx.no();return;}
  if(!pw){err.textContent='Falta la contraseña.';return;}
  btn.disabled=true;btn.textContent='ENTRANDO…';
  try{await signInWithEmailAndPassword(auth,u+'@'+DOMAIN,pw);sfx.fan();}
  catch(x){sfx.no();err.textContent=(x.code==='auth/network-request-failed')?'Sin conexión. Revisa tu internet.':(x.code==='auth/too-many-requests')?'Demasiados intentos. Espera un rato.':'Usuario o contraseña incorrectos.';}
  btn.disabled=false;btn.textContent='ENTRAR';
});

function stopAll(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];}
function startAll(){
  const err=e=>{console.warn('db',e);if(e.code==='permission-denied')toast('Esta cuenta no tiene acceso al álbum');};
  WHO.forEach(w=>unsubs.push(onSnapshot(doc(fs,'players',w),s=>{
    S.ex[w]=s.exists();const d=s.exists()?s.data():{};S.players[w]={...def(),...d,owned:{...(d.owned||{})}};
    if(!s.exists()&&w===realMe&&!s.metadata.fromCache&&!S['made'+w]){S['made'+w]=1;setDoc(doc(fs,'players',w),def(),{merge:true});}
    S.ready=true;safeRender();},err)));
  unsubs.push(onSnapshot(doc(fs,'config','main'),s=>{const d=s.exists()?s.data():{};S.cfg={...defCfg(),...d,names:{...defCfg().names,...(d.names||{})},cards:{...(d.cards||{})}};safeRender();},err));
  unsubs.push(onSnapshot(collection(fs,'cardimg'),s=>{const m={};s.docs.forEach(x=>{const d=x.data();if(d&&d.d)m[x.id]=d.d;});S.imgs=m;safeRender();},err));
  unsubs.push(onSnapshot(query(collection(fs,'trades'),orderBy('at','desc'),limit(40)),s=>{
    const prevInc=S.trades.filter(t=>t.status==='pending'&&t.to===me).length;
    S.trades=s.docs.map(x=>({id:x.id,...x.data()}));
    const inc=S.trades.filter(t=>t.status==='pending'&&t.to===me).length;
    if(S.ready&&inc>prevInc){sfx.rare();if(navigator.vibrate)navigator.vibrate(60);toast(nm(other())+' te propone un cambio');}
    safeRender();},err));
  if(owner)unsubs.push(onSnapshot(query(collection(fs,'codes'),orderBy('at','desc'),limit(30)),s=>{S.codes=s.docs.map(x=>({id:x.id,...x.data()}));safeRender();},err));
}

onAuthStateChanged(auth,user=>{
  stopAll();
  const u=user&&user.email?user.email.split('@')[0]:null;
  if(!user||!USERS[u]){
    if(user)signOut(auth);
    S.ready=false;$('login').hidden=false;$('app').hidden=true;return;
  }
  realMe=me=USERS[u];owner=realMe===OWNER;tab='album';page=0;
  $('login').hidden=true;$('app').hidden=false;render();startAll();
});

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
