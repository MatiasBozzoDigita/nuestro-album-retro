<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestro Álbum Retro</title>
<meta name="theme-color" content="#17142b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: consola de bolsillo — cabecera fija, contenido en panel central, barra de navegación tipo botonera abajo. */
:root{
  --bg:#0c1630; --panel:#142650; --panel2:#1d3468; --line:#3361b8; --line2:#24427e; --deep:#08112a; --boxa:#142650e0; --head:#0a1430eb; --nav:#091229; --slot1:#0f1d40; --slot2:#13244c;
  --ink:#f3ecd9; --mute:#a6bde6;
  --red:#e0483e; --yel:#f4c430; --grn:#3fae6a; --blu:#4377e0;
  --c-C:#8a84b8; --c-R:#4f8bff; --c-B:#d38cff; --c-L:#f4c430; --c-M:#ff5fd2;
  --pix:"Press Start 2P", ui-monospace, monospace;
  --body:"VT323", ui-monospace, monospace;
  color-scheme:dark;
}
html{background:var(--bg);overflow-x:hidden}body{background:transparent;color:var(--ink);overflow-x:hidden}
.wrap{overflow-x:clip}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated;pointer-events:none}
body{font-family:var(--body);font-size:20px;line-height:1.15;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(124px + env(safe-area-inset-bottom,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3,.pix{font-family:var(--pix);font-weight:400;letter-spacing:.02em}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  border-bottom:3px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;max-width:960px;margin:0 auto}
.logo{display:flex;gap:3px}
.logo i{width:10px;height:10px;display:block}
.hd h1{font-size:11px;line-height:1.5;flex:1;min-width:0}
.hd h1 small{display:block;font-family:var(--body);font-size:18px;color:var(--mute);letter-spacing:0}
.chip{font-family:var(--pix);font-size:9px;padding:7px 8px;background:var(--panel2);box-shadow:0 0 0 2px var(--line);white-space:nowrap}
.chip b{color:var(--yel);font-weight:400}
.iconbtn.off{opacity:.35;text-decoration:line-through}
.iconbtn{background:var(--panel2);border:0;box-shadow:0 0 0 2px var(--line);padding:6px 8px;font-family:var(--pix);font-size:9px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--nav);border-top:3px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav .row{display:flex;gap:8px;max-width:640px;margin:0 auto}
nav button{flex:1;border:0;background:var(--panel);box-shadow:0 0 0 2px var(--line),0 4px 0 2px #000;padding:10px 2px 8px;font-family:var(--pix);font-size:8px;line-height:1.6;position:relative}
nav button[aria-current="true"]{background:var(--red);box-shadow:0 0 0 2px #ff8a7f,0 4px 0 2px #6b1510}
nav button .dot{position:absolute;top:-6px;right:-4px;background:var(--yel);color:#000;font-size:8px;padding:3px 4px}
nav button:active{transform:translateY(3px)}

main{padding-top:18px}
.sec{display:flex;flex-direction:column;gap:16px}
.box{background:var(--boxa);box-shadow:0 0 0 3px var(--line),5px 5px 0 3px #0008;padding:16px}
.lbl{font-family:var(--pix);font-size:9px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--mute)}
.btn{border:0;background:var(--yel);color:#1a1300;font-family:var(--pix);font-size:10px;padding:13px 14px;box-shadow:0 0 0 3px #fff2,0 5px 0 3px #6e5300;line-height:1.5}
.btn.red{background:var(--red);color:#fff;box-shadow:0 0 0 3px #fff2,0 5px 0 3px #6b1510}
.btn.blue{background:var(--blu);color:#fff;box-shadow:0 0 0 3px #fff2,0 5px 0 3px #1b3577}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 0 0 3px var(--line),0 5px 0 3px #000}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 3px #fff2,0 1px 0 3px #0008}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{font-size:8px;padding:9px 10px}
input[type=text],input[type=number],select{font-family:var(--body);font-size:22px;background:var(--deep);color:var(--ink);border:0;box-shadow:0 0 0 2px var(--line);padding:6px 10px;width:100%;min-width:0}

/* album */
.pagehd{display:flex;align-items:center;gap:10px}
.pagehd .ttl{flex:1;min-width:0;text-align:center}
.pagehd h2{font-size:12px;line-height:1.6;text-wrap:balance}
.pagehd .who{font-size:18px;color:var(--mute)}
.arrow{border:0;background:var(--panel2);box-shadow:0 0 0 3px var(--line),0 4px 0 3px #000;width:46px;height:46px;font-family:var(--pix);font-size:14px;flex:none}
.arrow:active{transform:translateY(3px)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots button{width:22px;height:22px;border:0;padding:0;background:var(--panel2);box-shadow:0 0 0 2px var(--line);font-family:var(--pix);font-size:7px;color:var(--mute)}
.dots button.full{background:var(--grn);color:#062}
.dots button[aria-current="true"]{box-shadow:0 0 0 2px var(--yel);color:var(--ink)}
.prog{height:14px;background:var(--deep);box-shadow:0 0 0 2px var(--line);position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--pc,var(--grn)) 0 8px,color-mix(in srgb,var(--pc,var(--grn)) 75%,#000) 8px 10px)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 16px;padding:6px 4px}
@media (min-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}

.slot{aspect-ratio:5/7;max-width:100%;border:0;padding:0;background:repeating-linear-gradient(45deg,var(--slot1) 0 6px,var(--slot2) 6px 12px);
  box-shadow:0 0 0 3px var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#6d669e;container-type:inline-size;text-align:center}
.slot .n{font-family:var(--pix);font-size:13cqw}
.slot .t{font-size:13cqw;padding:0 6px;line-height:.95}
.slot .have{font-family:var(--pix);font-size:6cqw;color:var(--yel);padding:0 4px;line-height:1.5}
.slotbtn{border:0;padding:0;background:none;display:block;width:100%;position:relative}

/* card */
.card{aspect-ratio:5/7;width:100%;max-width:100%;position:relative;background:var(--panel2);container-type:inline-size;
  box-shadow:0 0 0 3px var(--rc),4px 4px 0 3px #0009;display:flex;flex-direction:column;overflow:hidden}
.card .top{background:var(--pc);color:#fff;font-family:var(--pix);font-size:6.5cqw;padding:5cqw 5cqw 4cqw;display:flex;justify-content:space-between;align-items:center;text-shadow:1px 1px 0 #0006}
.card .art{flex:1;margin:0 5cqw;background:#0c0a1a center/cover no-repeat;image-rendering:pixelated;box-shadow:inset 0 0 0 2px #0006;position:relative;overflow:hidden}
.card .art.spr{background-size:76% auto;background-color:color-mix(in srgb,var(--pc) 22%,#0c0a1a)}
.card .nm{font-size:12.5cqw;line-height:.9;padding:4cqw 5cqw 2cqw;text-align:center;min-height:2.3em;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.card .rar{display:flex;justify-content:center;gap:2cqw;padding-bottom:5cqw}
.card .rar i{width:5cqw;height:5cqw;background:var(--rc);display:block}
.card .cnt{position:absolute;top:-10px;right:-10px;z-index:3;background:var(--yel);color:#000;font-family:var(--pix);font-size:9px;padding:5px 6px;box-shadow:0 0 0 2px #000}
.card.holo .shine{position:absolute;top:0;bottom:0;left:-100%;width:100%;pointer-events:none;opacity:.5;will-change:transform;
  background:linear-gradient(105deg,transparent 15%,#ff8fe066 38%,#8feaff77 50%,#fff59a66 62%,transparent 85%);animation:holo 3.2s ease-in-out infinite}
.card.lg::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px #fff6b0,inset 0 0 14px 2px #f4c43088;opacity:0;animation:lgpulse 1.6s ease-in-out infinite;will-change:opacity}
@keyframes holo{0%{transform:translateX(0)}60%,100%{transform:translateX(200%)}}
@keyframes lgpulse{50%{opacity:1}}
.ov-open main .card .shine,.ov-open main .card.lg::after{animation-play-state:paused}

/* sobres */
.stock{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.minipack{width:74px;aspect-ratio:3/4;flex:none;position:relative;box-shadow:0 0 0 3px #fff3,5px 5px 0 3px #0009;
  background:linear-gradient(135deg,var(--red) 0 25%,var(--yel) 25% 50%,var(--grn) 50% 75%,var(--blu) 75%);}
.minipack::after{content:"MB";position:absolute;inset:30% 14%;background:var(--bg);color:var(--yel);font-family:var(--pix);font-size:11px;display:flex;align-items:center;justify-content:center}
.big{font-family:var(--pix);font-size:28px;color:var(--yel)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1;min-width:0}
.odds{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.odds div{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:8px;text-align:center}
.odds b{display:block;font-family:var(--pix);font-size:11px;font-weight:400;margin-top:4px}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:#080610e6;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.ovin{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px;margin:auto}
.ov.shake .ovin{animation:shake .5s steps(6) 2}
.ov.flash::before{content:"";position:fixed;inset:0;background:#fff6b0;animation:flash .6s ease-out forwards;pointer-events:none}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,5px)}}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.pack{width:min(240px,62vw);aspect-ratio:3/4.3;position:relative;touch-action:none;user-select:none;cursor:grab;
  background:linear-gradient(135deg,var(--red) 0 25%,var(--yel) 25% 50%,var(--grn) 50% 75%,var(--blu) 75%);box-shadow:0 0 0 4px #fff4,8px 8px 0 4px #000a}
.pack .body{position:absolute;inset:18% 12% 10%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:10px}
.pack .body .pix{font-size:10px;line-height:1.7;color:var(--yel)}
.pack .strip{position:absolute;left:0;right:0;top:6%;height:6%;background:repeating-linear-gradient(90deg,#fff8 0 6px,transparent 6px 12px)}
.pack .strip i{position:absolute;inset:0 auto 0 0;background:var(--bg);width:0}
.pack.gone{animation:gone .4s ease-in forwards}
@keyframes gone{to{transform:translateY(-40px) scale(1.15);opacity:0}}
.hint{font-family:var(--pix);font-size:9px;color:var(--mute);text-align:center;line-height:1.7;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.reveal{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 14px;width:100%}
@media (min-width:640px){.reveal .fc{width:calc((100% - 72px)/5)!important;max-width:190px}}
.ovin.wide{max-width:1000px}
.fc{perspective:900px;border:0;padding:0;background:none;display:flex;flex-direction:column;gap:10px;align-items:center;width:calc((100% - 28px)/3);max-width:170px;animation:deal .35s cubic-bezier(.2,.8,.3,1) backwards}
.fcin{width:100%;aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1);will-change:transform}
.fc.on .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.back{width:100%;height:100%;box-shadow:0 0 0 3px #fff3,4px 4px 0 3px #0009;
  background:repeating-conic-gradient(var(--panel2) 0 25%,var(--panel) 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:28px;color:var(--yel)}
.tag{font-family:var(--pix);font-size:8px;padding:5px 6px;visibility:hidden}
.fc.on .tag{visibility:visible}
.tag.new{background:var(--grn);color:#021}
.tag.dup{background:var(--line2);color:var(--mute)}
@keyframes deal{from{transform:translateY(40px) scale(.9);opacity:0}}
.ovtitle{font-size:12px;text-align:center;line-height:1.7}
.zoom{width:min(280px,70vw)}

/* cambios */
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 12px;padding:6px 4px}
.pick{border:0;padding:0;background:none;position:relative}
.pick[aria-pressed="true"] .card{outline:4px solid var(--yel);outline-offset:4px}
.trade{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.trade .mc{width:70px;flex:none}
.trade .ar{font-family:var(--pix);font-size:14px;color:var(--yel)}
.trade .txt{flex:1;min-width:140px}
.split{display:grid;gap:16px}
@media (min-width:720px){.split{grid-template-columns:1fr 1fr}}
.empty{color:var(--mute);padding:6px 0}

/* marcador */
.score{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.score .box{text-align:center}
.score .pct{font-family:var(--pix);font-size:24px;margin:10px 0 8px;color:var(--yel)}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center}
.pr .nm{grid-column:1/-1;font-size:20px;margin-top:8px}
.pr .v{font-family:var(--pix);font-size:9px;text-align:right}

/* taller */
.edl{display:grid;gap:10px}
.edrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
.edrow .mc{width:52px}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--yel);color:#1a1300;font-family:var(--pix);font-size:10px;line-height:1.6;padding:12px 14px;box-shadow:0 0 0 3px #000,6px 6px 0 3px #0008;max-width:calc(100% - 32px);text-align:center}
.banner{background:#3a2a10;box-shadow:0 0 0 2px var(--yel);padding:8px 12px;color:#ffe6a6}


/* pantalla de inicio */
.title{position:fixed;inset:0;z-index:65;background:radial-gradient(circle at 50% 35%,#ffffff14 0,transparent 60%);display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));}
.tin{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.tin .logo i{width:14px;height:14px}
.tlogo{font-size:clamp(20px,7vw,28px);line-height:1.45;margin:0;color:var(--yel);text-shadow:3px 3px 0 #e0483e,6px 6px 0 #0008}
.tfan{position:relative;width:100%;height:clamp(150px,42vw,200px)}
.tcard{position:absolute;top:8px;left:50%;width:clamp(86px,25vw,116px);margin-left:calc(clamp(86px,25vw,116px)/-2);animation:bob 3s ease-in-out infinite}
.tcard .back{aspect-ratio:5/7}
.tcard.t0{transform:translateX(-72%) rotate(-12deg);animation-delay:-.4s}
.tcard.t1{z-index:2;top:0;animation-delay:-1.2s}
.tcard.t2{transform:translateX(72%) rotate(12deg);animation-delay:-2s}
.tcard.t1{transform:none}
@keyframes bob{50%{margin-top:-8px}}
.tstat{display:flex;flex-direction:column;gap:4px;font-size:22px;color:var(--mute)}
.tstat b{font-weight:400;color:var(--ink);font-size:26px}
.tgift{font-family:var(--pix);font-size:9px;color:var(--yel);margin-top:4px;animation:blink 1s steps(2) infinite}
.tstart{font-size:13px;padding:16px 26px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.tfoot{font-size:18px;color:var(--mute)}
/* láminas con letra (sección Te amo) */
.card .art.ltr{background:radial-gradient(circle at 50% 45%,#ff8fb0 0,#ff4f7b 45%,#8a1f45 100%);display:flex;align-items:center;justify-content:center}
.card .art .lt{font-family:var(--pix);font-size:42cqw;line-height:1;color:#fff;text-shadow:4cqw 4cqw 0 #8a1f45,0 0 6cqw #fff8}
.pxedit .art{touch-action:none;cursor:grab}
.pxedit{width:min(250px,62vw)}

:root[data-skin="clasico"]{--bg:#17142b;--panel:#231e41;--panel2:#2e2853;--line:#4a4382;--line2:#3a3468;--deep:#0f0c1f;--boxa:#231e41de;--head:#0d0a1ee8;--nav:#100d20;--slot1:#1a1633;--slot2:#1f1a3c;--mute:#a39dd0}
:root[data-skin="atardecer"]{--bg:#1d0b19;--panel:#3a1431;--panel2:#4f1d43;--line:#b3487a;--line2:#6e2a5c;--deep:#160812;--boxa:#3a1431e0;--head:#1a0916eb;--nav:#170814;--slot1:#2a0f24;--slot2:#33122c;--mute:#e6a9c6}
:root[data-skin="bosque"]{--bg:#0a1d15;--panel:#133626;--panel2:#1b4934;--line:#36a06a;--line2:#23603f;--deep:#06140d;--boxa:#133626e0;--head:#08170feb;--nav:#07140d;--slot1:#0e281c;--slot2:#123022;--mute:#a8dcc0}
:root[data-skin="oceano"]{--bg:#061c22;--panel:#0c3742;--panel2:#124b59;--line:#22a5b8;--line2:#186472;--deep:#03141a;--boxa:#0c3742e0;--head:#05171ceb;--nav:#04141a;--slot1:#08262e;--slot2:#0b2e37;--mute:#9fd9e2}
/* colores con personalidad */
.carts .cart{background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 42%,#15121f),color-mix(in srgb,var(--pc) 22%,#0b0a12));box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 70%,#000),5px 5px 0 3px #0009}
.carts .cart:active{box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 70%,#000),2px 2px 0 3px #0009}
.cart .cwho{color:color-mix(in srgb,var(--pc) 35%,#fff)}
.cart .cbar{box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 60%,#000);background:#00000066}
.cart .cridge{background:repeating-linear-gradient(90deg,#00000066 0 3px,transparent 3px 7px)}
nav button{background:color-mix(in srgb,var(--tc,#777) 28%,var(--nav));color:color-mix(in srgb,var(--tc,#777) 30%,#fff);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc,#777) 70%,#000),0 4px 0 2px #000}
nav button[aria-current="true"]{background:var(--tc,#e0483e);color:#fff;text-shadow:1px 1px 0 #0007;box-shadow:0 0 0 2px color-mix(in srgb,var(--tc,#e0483e) 55%,#fff),0 4px 0 2px color-mix(in srgb,var(--tc,#e0483e) 40%,#000)}
#music{--tc:#e8609a}#mute{--tc:#29adff}
.iconbtn{background:color-mix(in srgb,var(--tc,#888) 35%,#0b0b14);box-shadow:0 0 0 2px var(--tc,#888);color:#fff}
.coll{background:linear-gradient(150deg,var(--panel2) 0%,var(--boxa) 65%);box-shadow:0 0 0 3px var(--line),inset 0 3px 0 #ffffff14,5px 5px 0 3px #0008}

/* paquete 2: movimiento */
nav{will-change:transform;transform:translateZ(0);backface-visibility:hidden}
#cats{will-change:transform;transform:translateZ(0)}
#main.anim .sec>*{animation:cin .38s cubic-bezier(.2,.8,.3,1.15) backwards}
#main.anim .sec>*:nth-child(2){animation-delay:.05s}#main.anim .sec>*:nth-child(3){animation-delay:.1s}#main.anim .sec>*:nth-child(4){animation-delay:.15s}#main.anim .sec>*:nth-child(5){animation-delay:.2s}#main.anim .sec>*:nth-child(n+6){animation-delay:.25s}
#main.anim .carts>.cart{animation:cin .4s cubic-bezier(.2,.8,.3,1.2) backwards;animation-delay:calc(var(--i,0)*35ms + .1s)}
#main.anim .grid>*{animation:cardin .4s cubic-bezier(.2,.8,.3,1.2) backwards;animation-delay:calc(var(--i,0)*35ms)}
.grid.gin{animation:gfade .28s ease-out}.grid.gin.fromR{animation-name:pgR}.grid.gin.fromL{animation-name:pgL}
@keyframes gfade{from{opacity:.4}}
@keyframes pgR{from{opacity:.4;transform:translateX(12px)}}
@keyframes pgL{from{opacity:.4;transform:translateX(-12px)}}
#main.animg .prog i{animation:none}
#main.anim .prog i,#main.anim .cbar i{animation:grow .9s cubic-bezier(.2,.8,.3,1) .2s backwards}
@keyframes cin{from{opacity:0;transform:translateY(18px)}}
@keyframes cardin{from{opacity:0;transform:translateY(22px) scale(.9)}}
@keyframes fromR{from{opacity:0;transform:translateX(36px)}}
@keyframes fromL{from{opacity:0;transform:translateX(-36px)}}
@keyframes grow{from{width:0}}
.cart.ins{animation:insc .3s ease-in forwards!important;z-index:3}
@keyframes insc{35%{transform:translateY(-10px) scale(1.04)}100%{transform:translateY(46px) scale(.82);opacity:0}}
#main.booting .pagehd h2{animation:bootf .45s steps(4)}
@keyframes bootf{0%,50%{opacity:.2}25%,75%{opacity:1}}
.bn,.coin b,.hearts span{display:inline-block}

@keyframes tapb{35%{transform:scale(.93)}100%{transform:scale(1)}}

nav button[aria-current="true"]{animation:navon .3s steps(3)}

}

function draw(){const r=Math.random()*100;let acc=0,k='C';for(const x of ['M','L','B','R','C']){acc+=RAR[x].p;if(r<acc){k=x;break;}}const l=BYR[k];return l[Math.floor(Math.random()*l.length)];}
function openPack(){
  const pl=P(me);if((pl.packs||0)<1||openedToday(me)>=cap())return;
  const owned={...(pl.owned||{})},upd={},drawn=[],before=PAGES.map((_,i)=>pageDone(me,i));
  for(let i=0;i<PER_PACK;i++){const c=draw(),was=owned[c.id]||0;drawn.push({c,isNew:was===0});owned[c.id]=was+1;upd[c.id]=owned[c.id];}
  const done=SECTIONS.map((_,i)=>i).filter(i=>before[i]<SC(i).length&&SC(i).every(c=>owned[c.id]));
  patchPlayer(me,{owned:upd,packs:(pl.packs||1)-1,openedDay:today(),openedToday:openedToday(me)+1,opened:(pl.opened||0)+1});
  showPack(drawn,done);
}
function showPack(drawn,done){
  const ov=$('ov'),inn=$('ovin');ov.hidden=false;ov.className='ov';document.body.classList.add('ov-open');
  inn.innerHTML=`<div class="pack" id="pk"><div class="strip"><i id="pkst"></i></div><div class="body"><div class="pix">NUESTRO<br>ÁLBUM<br>RETRO</div><div class="muted">${PER_PACK} láminas</div></div></div>
    <div class="hint">DESLIZA O TOCA<br>PARA ABRIR</div>`;
  const pk=$('pk'),st=$('pkst');let prog=0,sx=null,gone=false;
  const setP=v=>{prog=Math.min(1,v);st.style.width=prog*100+'%';if(prog>=1)torn();};
  pk.onpointerdown=e=>{sx=e.clientX;pk.setPointerCapture(e.pointerId);ac();};
  pk.onpointermove=e=>{if(sx==null)return;const d=Math.abs(e.clientX-sx);if(d>8){sfx.tear();setP(prog+d/pk.offsetWidth);sx=e.clientX;}};
  pk.onpointerup=e=>{if(sx!=null&&Math.abs(e.clientX-sx)<6&&prog<1){sfx.tear();setP(prog+.34);}sx=null;};
  function torn(){if(gone)return;gone=true;pk.onpointermove=pk.onpointerdown=pk.onpointerup=null;pk.classList.add('gone');if(navigator.vibrate)navigator.vibrate(30);setTimeout(reveal,420);}
  function reveal(){
    inn.className='ovin wide';inn.innerHTML=`<div class="ovtitle pix">TOCA CADA LÁMINA</div><div class="reveal">${drawn.map((d,i)=>`<button class="fc" data-i="${i}" style="animation-delay:${i*.08}s"><div class="fcin"><div class="face"><div class="back${d.c.r!=='C'?' g'+d.c.r:''}">?</div></div><div class="face front">${cardHTML(d.c)}</div></div><span class="tag ${d.isNew?'new':'dup'}">${d.isNew?'¡NUEVA!':'REPETIDA'}</span></button>`).join('')}</div>
      <div class="row" id="pkdone" hidden></div>`;
    let left=drawn.length;
    inn.querySelectorAll('.fc').forEach(b=>b.onclick=()=>{if(b.classList.contains('on'))return;b.classList.add('on');const d=drawn[+b.dataset.i];
      if(d.c.r==='M'){ov.classList.add('shake','flash','mythic');sfx.myth();Cats.party();if(navigator.vibrate)navigator.vibrate([120,60,120,60,120,60,400]);setTimeout(()=>ov.classList.remove('shake','flash'),1600);}

}

    if(pts.size>=2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch.d>0)setZ(pinch.z*d/pinch.d);}
    else if(last){pend.px+=(e.clientX-last.x)/r.width;pend.py+=(e.clientY-last.y)/r.height;pend.px=Math.max(-1.5,Math.min(1.5,pend.px));pend.py=Math.max(-1.5,Math.min(1.5,pend.py));last={x:e.clientX,y:e.clientY};redrawPx();}};
  const up=e=>{pts.delete(e.pointerId);pinch=null;last=pts.size===1?[...pts.values()][0]:null;};
  art.onpointerup=up;art.onpointercancel=up;
  art.onwheel=e=>{e.preventDefault();setZ(pend.z*(e.deltaY<0?1.08:1/1.08));};
  $('pxtog').onclick=()=>{pxOn=!pxOn;try{localStorage.setItem('alb_px',pxOn?'1':'0')}catch(e){}sfx.blip();showPx();};
  $('ovin').querySelectorAll('[data-pxd]').forEach(b=>b.onclick=()=>{pxDet=b.dataset.pxd;try{localStorage.setItem('alb_pxd',pxDet)}catch(e){}sfx.blip();showPx();});
  $('pxcancel').onclick=()=>{URL.revokeObjectURL(pend.img.src);pend=null;closeOv();};
  $('pxsave').onclick=async()=>{const b=$('pxsave');b.disabled=true;b.textContent='GUARDANDO…';const id=pend.id,url=makeURL();
    try{await setDoc(doc(fs,'cardimg',id),{d:url});URL.revokeObjectURL(pend.img.src);pend=null;closeOv();sfx.ok();toast(id.startsWith('cover~')?'Portada lista':'Foto lista');}
    catch(e){b.disabled=false;b.textContent='GUARDAR';toast('No se pudo guardar. Revisa tu conexión.');}};
  redrawPx();
}

/* ===== Eventos ===== */
const nameT={};
function debounced(key,fn){clearTimeout(nameT[key]);nameT[key]=setTimeout(fn,600);}
function bind(){
  const m=$('main');
  m.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>flip(+b.dataset.pg));
  m.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{if(b.classList.contains('ins'))return;b.classList.add('ins');sfx.insert();
    setTimeout(()=>{sec=+b.dataset.sec;spg=0;flipDir='';animNext=true;render();scrollTo(0,0);const mm=$('main');mm.classList.add('booting');setTimeout(()=>mm.classList.remove('booting'),450);},300);});
  m.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{sec=-1;sfx.blip();animNext=true;render();scrollTo(0,0);});
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=+b.dataset.go;flipDir=g>spg?'fromR':'fromL';spg=g;sfx.blip();flipRender();});
  m.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{sfx.blip();showCard(b.dataset.card);});
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn;};
  on('open',()=>{ac();sfx.blip();openPack();});on('daily',claimDaily);on('swap',swapDups);on('redeem',redeem);on('propose',propose);on('mkcode',mkCode);on('reset',doReset);
  on('logout',()=>{signOut(auth);});
  m.querySelectorAll('[data-retar]').forEach(b=>b.onclick=()=>duelInvite(b.dataset.retar));
  on('dacc',duelAccept);on('drej',async()=>{try{await updateDoc(duelRef(),{status:'cancelled'});}catch(e){}});
  on('dcan',async()=>{try{await updateDoc(duelRef(),{status:'cancelled'});}catch(e){}});
  on('dwait',()=>{G={id:S.duel.id,kind:S.duel.game,phase:'waitStart'};waitStartView(S.duel);});
  on('dwait2',()=>{const d=S.duel;G={id:d.id,kind:d.game,phase:'waitOther',myT:d.res[me].t,doneAt:d.res[me].at||Date.now()};waitOtherView(d);});
  on('dplay',()=>startGame(S.duel));
  m.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{const k=b.dataset.skin;applySkin(k);S.cfg.skin=k;sfx.ok();patchCfg({skin:k});render();});on('songrm',removeSong);
  const si=$('songin');if(si)si.onchange=()=>uploadSong(si.files[0]);
  m.querySelectorAll('[data-give]').forEach(b=>b.onclick=()=>{tGive=tGive===b.dataset.give?null:b.dataset.give;sfx.blip();render();});
  m.querySelectorAll('[data-want]').forEach(b=>b.onclick=()=>{tWant=tWant===b.dataset.want?null:b.dataset.want;sfx.blip();render();});
  m.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{b.disabled=true;accept(b.dataset.acc);});
  m.querySelectorAll('[data-rej]').forEach(b=>b.onclick=()=>{sfx.no();setTrade(b.dataset.rej,{status:'rejected'});});
  m.querySelectorAll('[data-can]').forEach(b=>b.onclick=()=>{setTrade(b.dataset.can,{status:'cancelled'});});
  m.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{me=b.dataset.as;tGive=tWant=null;sfx.ok();render();});
  WHO.forEach(w=>{const i=$('nm-'+w);if(i)i.oninput=()=>debounced('nm'+w,()=>patchCfg({names:{[w]:i.value.trim()||(w==='matias'?'Mati':'Marcelita')}}));});
  const ci=$('capin');if(ci)ci.oninput=()=>debounced('cap',()=>patchCfg({packCap:Math.max(1,Math.min(20,+ci.value||4))}));
  const tp=$('tpage');if(tp)tp.onchange=()=>{tallerPage=+tp.value;render();};
  m.querySelectorAll('[data-cn]').forEach(i=>i.oninput=()=>debounced('cn'+i.dataset.cn,()=>patchCfg({cards:{[i.dataset.cn]:{name:i.value.trim()}}})));
  m.querySelectorAll('[data-tview]').forEach(b=>b.onclick=()=>{sfx.blip();showTallerCard(b.dataset.tview);});
  m.querySelectorAll('[data-cover]').forEach(i=>i.onchange=()=>{const f=i.files[0];i.value='';upload(covId(+i.dataset.cover),f,+i.dataset.cover);});
  m.querySelectorAll('[data-up]').forEach(i=>i.onchange=()=>{const f=i.files[0];i.value='';upload(i.dataset.up,f);});
}


/* ===== Pantalla de inicio ===== */
function renderTitle(){
  if($('title').hidden)return;
  const mine=CARDS.filter(c=>cnt(me,c.id)>0),order={M:0,L:1,B:2,R:3,C:4};
  const best=mine.sort((a,b)=>order[a.r]-order[b.r]).slice(0,3);
  $('tfan').innerHTML=[0,1,2].map(i=>`<div class="tcard t${i}">${best[i]?cardHTML(best[i]):'<div class="back">?</div>'}</div>`).join('');
  if(!S.ready){$('tstat').textContent='Cargando tu colección…';return;}
  const daily=P(me).lastDaily!==today();
  $('tstat').innerHTML=`<b>¡Hola, ${esc(nm(me))}!</b><span>${uniq(me)}/${CARDS.length} láminas · ${P(me).packs||0} sobre${(P(me).packs||0)===1?'':'s'}</span>${daily?'<span class="tgift">¡TIENES TU REGALO DIARIO!</span>':''}`;
}
$('tstart').onclick=()=>{ac();sfx.fan();$('title').hidden=true;$('app').hidden=false;Cats.show();tab=P(me).lastDaily!==today()?'sobres':'album';sec=-1;animNext=true;render();scrollTo(0,0);if(musicOn)Music.start();};

/* ===== Inicio de sesión ===== */
$('loginform').addEventListener('submit',async e=>{
  e.preventDefault();ac();
  const u=slug($('lu').value),pw=$('lp').value,err=$('lerr'),btn=$('lbtn');
  err.textContent='';
  if(!USERS[u]){err.textContent='Ese jugador no existe. Escribe Mati o Marcelita.';sfx.no();return;}
  if(!pw){err.textContent='Falta la contraseña.';return;}
  btn.disabled=true;btn.textContent='ENTRANDO…';
  try{await signInWithEmailAndPassword(auth,u+'@'+DOMAIN,pw);sfx.fan();}
  catch(x){sfx.no();err.textContent=(x.code==='auth/network-request-failed')?'Sin conexión. Revisa tu internet.':(x.code==='auth/too-many-requests')?'Demasiados intentos. Espera un rato.':'Usuario o contraseña incorrectos.';}
  btn.disabled=false;btn.textContent='ENTRAR';
});

function stopAll(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];}
function startAll(){
  const err=e=>{console.warn('db',e);if(e.code==='permission-denied')toast('Esta cuenta no tiene acceso al álbum');};
  WHO.forEach(w=>unsubs.push(onSnapshot(doc(fs,'players',w),s=>{
    S.ex[w]=s.exists();const d=s.exists()?s.data():{};S.players[w]={...def(),...d,owned:{...(d.owned||{})}};
    if(!s.exists()&&w===realMe&&!s.metadata.fromCache&&!S['made'+w]){S['made'+w]=1;setDoc(doc(fs,'players',w),def(),{merge:true});}
    S.ready=true;safeRender();},err)));
  unsubs.push(onSnapshot(doc(fs,'duels','current'),x=>{S.duel=x.exists()?x.data():null;duelSync();safeRender();},err));
  unsubs.push(onSnapshot(doc(fs,'music','meta'),x=>loadSong(x.exists()?x.data():null),err));
  unsubs.push(onSnapshot(doc(fs,'config','main'),s=>{const d=s.exists()?s.data():{};S.cfg={...defCfg(),...d,names:{...defCfg().names,...(d.names||{})},cards:{...(d.cards||{})}};applySkin(S.cfg.skin||'noche');safeRender();},err));
  unsubs.push(onSnapshot(collection(fs,'cardimg'),s=>{const m={};s.docs.forEach(x=>{const d=x.data();if(d&&d.d)m[x.id]=d.d;});S.imgs=m;safeRender();},err));
  unsubs.push(onSnapshot(query(collection(fs,'trades'),orderBy('at','desc'),limit(40)),s=>{
    const prevInc=S.trades.filter(t=>t.status==='pending'&&t.to===me).length;
    S.trades=s.docs.map(x=>({id:x.id,...x.data()}));
    const inc=S.trades.filter(t=>t.status==='pending'&&t.to===me).length;
    if(S.ready&&inc>prevInc){sfx.rare();if(navigator.vibrate)navigator.vibrate(60);toast(nm(other())+' te propone un cambio');}
    safeRender();},err));
  if(owner)unsubs.push(onSnapshot(query(collection(fs,'codes'),orderBy('at','desc'),limit(30)),s=>{S.codes=s.docs.map(x=>({id:x.id,...x.data()}));safeRender();},err));
}

onAuthStateChanged(auth,user=>{
  stopAll();
  const u=user&&user.email?user.email.split('@')[0]:null;
  if(!user||!USERS[u]){
    if(user)signOut(auth);
    S.ready=false;$('login').hidden=false;$('app').hidden=true;return;
  }
  realMe=me=USERS[u];owner=realMe===OWNER;tab='album';sec=-1;spg=0;
  $('login').hidden=true;$('app').hidden=true;$('title').hidden=false;renderTitle();render();startAll();
});

const APP_VERSION='26';
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload();}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();setInterval(()=>r.update(),30*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update();});}).catch(()=>{}));
}
